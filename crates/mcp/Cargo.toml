[package]
name = "qymcad-mcp"
description = "MCP (Model Context Protocol) stdio server for building parametric QymCAD parts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "qymcad-mcp"
path = "src/main.rs"

[dependencies]
qymcad-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# `dup2` to move OCCT's stdout chatter off the protocol channel (ADR 0005). Already in the tree via qymcad-io.
libc = "0.2"

[lints]
workspace = true
