[package]
name = "qymcad-engine"
description = "Headless modelling engine over the QymCAD kernel: everything qymcad-mcp knows about QymCAD lives here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
qymcad-core.workspace = true
qymcad-io.workspace = true
qymcad-kernel.workspace = true
qymcad-testkit.workspace = true
qymcad-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# PNG compression for `render` (ADR 0004). Already in the build through qymcad-io (zip, usvg): no new crate.
flate2 = "1.1"

[dev-dependencies]
# An independent PNG decoder to check the encoder and rendered images (tests only, ADR 0004).
png = "0.18"

[lints]
workspace = true
